name: Validate Catracada Pages & Theme Structure

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Verify GitHub Pages index.html and Shopify OS 2.0 files
        run: |
          test -f index.html
          test -f .nojekyll
          test -f layout/theme.liquid
          test -f templates/index.json
          echo "Catracada GitHub Pages & Shopify OS 2.0 files verified successfully!"
